<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompetku - Login</title>
    <style>
        /* 1. RESET & PENGATURAN DASAR */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a; 
            overflow: hidden; 
        }

        /* 2. KODE VIDEO BACKGROUND */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            z-index: -1; 
            transform: translateZ(0); 
            will-change: transform;
            backface-visibility: hidden;
        }

        /* 3. GAYA FORM LOGIN & SIGN UP */
        .login-card {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1; 
        }

        .login-card h2 {
            margin-bottom: 5px;
            font-size: 28px;
        }

        .login-card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            font-size: 16px;
        }
        
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 126, 95, 0.8); 
            background: rgba(255, 126, 95, 0.3); 
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: rgba(255, 126, 95, 0.5); 
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .toggle-link a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-left: 5px;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .toggle-link a:hover {
            color: #ff7e5f; 
        }

        /* ================= GAYA LOGO DUNIA & POP-UP ================= */
        .language-container {
            position: fixed; 
            top: 20px;
            left: 20px;
            z-index: 999; 
        }

        .globe-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), inset 0 0 10px rgba(255, 255, 255, 0.3);
            color: #ffffff; 
            transition: all 0.3s ease;
        }

        .globe-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000; 
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: white;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-content h3 {
            margin-top: 5px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 18px;
        }

        .lang-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lang-list button {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .lang-list button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- ================= KODE VIDEO BACKGROUND ================= -->
    <video autoplay muted loop playsinline preload="auto" id="bg-video">
        <!-- Link video diperbarui ke format RAW dan path folder Login -->
        <source src="https://github.com/preski08/DompetkuX001/raw/59620102ab922a9f004292ba6568cffbdacd7329/Login/loginvidio.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <!-- ================= LOGO DUNIA ================= -->
    <div class="language-container">
        <button id="globeBtn" class="globe-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
        </button>
    </div>

    <!-- ================= KARTU FORM ================= -->
    <div class="login-card">
        
        <!-- FORM LOGIN (Tampil Pertama) -->
        <div id="form-login">
            <h2 id="text-title-login">Dompetku</h2>
            <p id="text-subtitle-login">Sign in to continue</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="text" id="input-id-login" placeholder="ID" required>
                </div>
                <div class="input-group">
                    <input type="password" id="input-pass-login" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn-submit" id="btn-login">Sign In</button>
                
                <div class="toggle-link">
                    <span id="text-no-account">Belum punya akun?</span> <a onclick="tampilkanSignUp()" id="link-to-signup">Sign Up</a>
                </div>
            </form>
        </div>

        <!-- FORM SIGN UP (Tersembunyi di awal) -->
        <div id="form-signup" style="display: none;">
            <h2 id="text-title-signup">Daftar Akun</h2>
            <p id="text-subtitle-signup">Buat akun Dompetku baru</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="text" id="input-id-signup" placeholder="ID Baru" required>
                </div>
                <div class="input-group">
                    <input type="password" id="input-pass-signup" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <input type="password" id="input-confirm-signup" placeholder="Konfirmasi Password" required>
                </div>
                
                <button type="submit" class="btn-submit" id="btn-signup">Sign Up</button>
                
                <div class="toggle-link">
                    <span id="text-have-account">Sudah punya akun?</span> <a onclick="tampilkanLogin()" id="link-to-login">Sign In</a>
                </div>
            </form>
        </div>

    </div>

    <!-- ================= POP-UP PILIHAN BAHASA ================= -->
    <div id="languageModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3>Select Language</h3>
            <div class="lang-list">
                <button onclick="setLanguage('en')">🇬🇧 English</button>
                <button onclick="setLanguage('ja')">🇯🇵 日本語 (Japanese)</button>
                <button onclick="setLanguage('zh')">🇨🇳 中文 (Chinese)</button>
                <button onclick="setLanguage('id')">🇮🇩 Bahasa Indonesia</button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // --- 1. FUNGSI GANTI FORM LOGIN/SIGNUP ---
        function tampilkanSignUp() {
            document.getElementById('form-login').style.display = 'none';
            document.getElementById('form-signup').style.display = 'block';
        }

        function tampilkanLogin() {
            document.getElementById('form-signup').style.display = 'none';
            document.getElementById('form-login').style.display = 'block';
        }

        // --- 2. KAMUS TERJEMAHAN (TRANSLATIONS) ---
        const translations = {
            id: {
                titleLogin: "Dompetku",
                subtitleLogin: "Masuk untuk melanjutkan",
                placeholderId: "ID",
                placeholderPass: "Kata Sandi",
                btnLogin: "Masuk",
                noAccount: "Belum punya akun?",
                linkSignUp: "Daftar",
                titleSignUp: "Daftar Akun",
                subtitleSignUp: "Buat akun Dompetku baru",
                placeholderNewId: "ID Baru",
                placeholderConfirmPass: "Konfirmasi Kata Sandi",
                btnSignUp: "Daftar",
                haveAccount: "Sudah punya akun?",
                linkSignIn: "Masuk"
            },
            en: {
                titleLogin: "Dompetku",
                subtitleLogin: "Sign in to continue",
                placeholderId: "ID",
                placeholderPass: "Password",
                btnLogin: "Sign In",
                noAccount: "Don't have an account?",
                linkSignUp: "Sign Up",
                titleSignUp: "Register Account",
                subtitleSignUp: "Create a new Dompetku account",
                placeholderNewId: "New ID",
                placeholderConfirmPass: "Confirm Password",
                btnSignUp: "Sign Up",
                haveAccount: "Already have an account?",
                linkSignIn: "Sign In"
            },
            ja: {
                titleLogin: "Dompetku",
                subtitleLogin: "続行するにはサインインしてください",
                placeholderId: "ID",
                placeholderPass: "パスワード",
                btnLogin: "サインイン",
                noAccount: "アカウントをお持ちでないですか？",
                linkSignUp: "新規登録",
                titleSignUp: "アカウント登録",
                subtitleSignUp: "新しいDompetkuアカウントを作成",
                placeholderNewId: "新しいID",
                placeholderConfirmPass: "パスワードの確認",
                btnSignUp: "登録",
                haveAccount: "すでにアカウントをお持ちですか？",
                linkSignIn: "サインイン"
            },
            zh: {
                titleLogin: "Dompetku",
                subtitleLogin: "登录以继续",
                placeholderId: "ID",
                placeholderPass: "密码",
                btnLogin: "登录",
                noAccount: "还没有账号？",
                linkSignUp: "注册",
                titleSignUp: "注册账号",
                subtitleSignUp: "创建新的 Dompetku 账号",
                placeholderNewId: "新 ID",
                placeholderConfirmPass: "确认密码",
                btnSignUp: "注册",
                haveAccount: "已有账号？",
                linkSignIn: "登录"
            }
        };

        // --- 3. FUNGSI MENGUBAH BAHASA ---
        function setLanguage(lang) {
            const t = translations[lang];
            
            // Ubah Teks Form Login
            document.getElementById('text-title-login').innerHTML = t.titleLogin;
            document.getElementById('text-subtitle-login').innerHTML = t.subtitleLogin;
            document.getElementById('input-id-login').placeholder = t.placeholderId;
            document.getElementById('input-pass-login').placeholder = t.placeholderPass;
            document.getElementById('btn-login').innerHTML = t.btnLogin;
            document.getElementById('text-no-account').innerHTML = t.noAccount;
            document.getElementById('link-to-signup').innerHTML = t.linkSignUp;

            // Ubah Teks Form Sign Up
            document.getElementById('text-title-signup').innerHTML = t.titleSignUp;
            document.getElementById('text-subtitle-signup').innerHTML = t.subtitleSignUp;
            document.getElementById('input-id-signup').placeholder = t.placeholderNewId;
            document.getElementById('input-pass-signup').placeholder = t.placeholderPass;
            document.getElementById('input-confirm-signup').placeholder = t.placeholderConfirmPass;
            document.getElementById('btn-signup').innerHTML = t.btnSignUp;
            document.getElementById('text-have-account').innerHTML = t.haveAccount;
            document.getElementById('link-to-login').innerHTML = t.linkSignIn;

            // Tutup pop-up setelah memilih
            languageModal.classList.remove('show');
        }

        // --- 4. FUNGSI POP-UP BAHASA ---
        const globeBtn = document.getElementById('globeBtn');
        const languageModal = document.getElementById('languageModal');
        const closeModal = document.getElementById('closeModal');

        globeBtn.addEventListener('click', () => {
            languageModal.classList.add('show');
        });

        closeModal.addEventListener('click', () => {
            languageModal.classList.remove('show');
        });

        window.addEventListener('click', (event) => {
            if (event.target === languageModal) {
                languageModal.classList.remove('show');
            }
        });
    </script>

</body>
</html>
